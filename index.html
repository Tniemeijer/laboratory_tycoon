<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Tycoon</title>
    <link rel="stylesheet" href="/src/client/styles.css">
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud">
        <div id="bar">
            <div class="stat money" id="bar-money">$0</div>
            <div class="stat rep" id="bar-rep">★</div>
            <div class="stat day">
                <span id="bar-day">Day 1</span>
                <span class="daybar"><i id="bar-dayfill"></i></span>
            </div>
            <div class="stat" id="bar-clean">🧹 100%</div>
            <button id="bar-toggle" aria-label="Show/hide menu">☰</button>

            <div class="bar-extra" id="bar-extra">
                <div class="menus">
                    <button class="menu-btn" data-menu="build">Build</button>
                    <button class="menu-btn" data-menu="contracts">Contracts</button>
                    <button class="menu-btn" data-menu="staff">Staff</button>
                    <button class="menu-btn" data-menu="stock">Stock</button>
                    <button class="menu-btn" data-menu="upgrades">Upgrades</button>
                    <button class="menu-btn" data-menu="lab">Lab</button>
                    <button class="menu-btn" data-menu="help">? Help</button>
                    <span id="tool-chip" hidden></span>
                </div>

                <div class="spacer"></div>
                <button id="bar-pause" aria-label="Pause or resume"></button>
                <span id="bar-speed" class="speeds">
                    <button data-speed="1" aria-label="Normal speed">1×</button>
                    <button data-speed="2" aria-label="Double speed">2×</button>
                    <button data-speed="3" aria-label="Triple speed">3×</button>
                </span>
                <button id="bar-sound" aria-label="Volume"><i class="spk"></i><i class="arc a1"></i><i class="arc a2"></i><i class="arc a3"></i></button>
                <button id="bar-new">New</button>
            </div>
        </div>

        <div id="dropdown" hidden>
            <button id="dropdown-close" aria-label="Close">×</button>
            <div id="dropdown-content"></div>
        </div>

        <!-- Emergency banner: only ever visible when something is actually happening (a fire to
             evacuate from, a sealed containment room, a claim to answer). See renderAlerts(). -->
        <div id="alerts" hidden></div>

        <!-- Guided first run. Driven by ui/tutorial.js, which watches real game state to decide
             when each step is done. Hidden entirely once finished or skipped. -->
        <div id="tutorial" hidden></div>

        <!-- Aggregated "what's blocking my active contracts" list. See ui/tasks.js. -->
        <div id="tasks" hidden></div>

        <!-- Click a scientist to see who they are and what they're doing. See ui/inspector.js. -->
        <div id="inspector" hidden></div>

        <div id="hint">Drag or WASD to move the view · Q/E (or ⟲⟳) to turn · scroll/pinch to zoom</div>
        <button id="rotate-pill" hidden>⟳ Rotate</button>
        <div id="cam-rotate">
            <button id="cam-rotate-left" aria-label="Rotate view left">⟲</button>
            <button id="cam-rotate-right" aria-label="Rotate view right">⟳</button>
        </div>
        <!-- Volume slider, opened from the speaker in the top bar. See ui/toolbar.js. -->
        <div id="volpop" hidden>
            <button id="voldown" aria-label="Quieter">−</button>
            <div id="volbar" role="slider" tabindex="0" aria-label="Volume"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"></div>
            <button id="volup" aria-label="Louder">+</button>
            <span id="volnum">70%</span>
        </div>

        <div id="toast"></div>

        <!-- Title screen and end-of-run summary, the same overlay in two states. See ui/title.js.
             The lab keeps rendering behind it, paused. -->
        <div id="title-screen" hidden></div>
    </div>

    <script type="module" src="/src/client/main.js"></script>
</body>
</html>
